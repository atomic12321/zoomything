<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brushcue Zoom Animator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #111318;
            color: #e5e7eb;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .app {
            max-width: 900px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 22px;
            font-weight: 750;
        }

        .subtitle {
            font-size: 13px;
            color: #9ca3af;
        }

        .upload {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="file"] {
            display: none;
        }

        .upload-label {
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            background: #292c35;
            color: #e5e7eb;
        }

        .file-name {
            font-size: 12px;
            color: #9ca3af;
        }

        .preview {
            position: relative;
            background: #050505;
            overflow: hidden;
            border-radius: 10px;
            width: 100%;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            display: none;
        }

        #placeholder {
            color: #737783;
            text-align: center;
            padding: 20px;
        }

        #placeholder .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin: 14px 0;
            flex-wrap: wrap;
        }

        button {
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
        }

        .primary {
            background: #8b5cf6;
            color: white;
        }

        .secondary {
            background: #292c35;
            color: #e5e7eb;
        }

        button:hover {
            filter: brightness(1.15);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .panel {
            background: #1b1d24;
            border: 1px solid #30333d;
            border-radius: 12px;
            padding: 16px;
        }

        .label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .value {
            color: #c4b5fd;
            font-variant-numeric: tabular-nums;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #8b5cf6;
            cursor: pointer;
        }

        .small {
            font-size: 12px;
            color: #9ca3af;
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
        }

        .progress-container {
            height: 6px;
            background: #30333d;
            border-radius: 6px;
            margin-top: 8px;
            overflow: hidden;
        }

        #progress {
            width: 0%;
            height: 100%;
            background: #8b5cf6;
        }

        .footer {
            font-size: 12px;
            color: #777f8f;
            margin-top: 14px;
        }

        @media (max-width: 600px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <div>
            <div class="title">Zoom Animator</div>
            <div class="subtitle">Brushcue-style image zoom</div>
        </div>

        <div class="upload">
            <label for="file" class="upload-label">
                Upload Image
            </label>

            <input id="file" type="file" accept="image/*">

            <span id="file-name" class="file-name">
                No image selected
            </span>
        </div>
    </div>

    <!-- Preview -->
    <div class="preview" id="preview">

        <img id="image" alt="Preview">

        <div id="placeholder">
            <div class="icon">＋</div>
            <div>Upload an image to preview your animation</div>
        </div>

    </div>

    <!-- Buttons -->
    <div class="buttons">
        <button id="play" class="primary">
            ▶ Play Animation
        </button>

        <button id="reset" class="secondary">
            ↺ Reset
        </button>
    </div>

    <!-- Controls -->
    <div class="controls">

        <!-- Initial Zoom -->
        <div class="panel">
            <div class="label">
                <span>Initial Zoom</span>
                <span id="zoom-value" class="value">6.3×</span>
            </div>

            <input
                id="zoom"
                type="range"
                min="1"
                max="100"
                step="0.1"
                value="6.3"
            >
        </div>

        <!-- Duration -->
        <div class="panel">
            <div class="label">
                <span>Duration</span>
                <span id="duration-value" class="value">7.7 sec</span>
            </div>

            <input
                id="duration"
                type="range"
                min="0.5"
                max="45"
                step="0.1"
                value="7.7"
            >
        </div>

        <!-- Focus Height -->
        <div class="panel">
            <div class="label">
                <span>Focus Height</span>
                <span id="focus-value" class="value">0.35</span>
            </div>

            <input
                id="focus"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.35"
            >

            <div class="small range-labels">
                <span>Top</span>
                <span>Bottom</span>
            </div>
        </div>

        <!-- Progress -->
        <div class="panel">
            <div style="font-weight:600;margin-bottom:5px;">
                Animation Progress
            </div>

            <div id="progress-text" class="value">
                0%
            </div>

            <div class="progress-container">
                <div id="progress"></div>
            </div>
        </div>

    </div>

    <div class="footer">
        Scale = Initial Zoom ^ (1 − Progress)
    </div>

</div>

<script>
    // Elements
    const image = document.getElementById("image");
    const preview = document.getElementById("preview");
    const placeholder = document.getElementById("placeholder");

    const fileInput = document.getElementById("file");
    const zoomInput = document.getElementById("zoom");
    const durationInput = document.getElementById("duration");
    const focusInput = document.getElementById("focus");

    const playButton = document.getElementById("play");
    const resetButton = document.getElementById("reset");

    const progressBar = document.getElementById("progress");
    const progressText = document.getElementById("progress-text");

    // Settings
    let initialZoom = 6.3;
    let duration = 7.7;
    let focusY = 0.35;

    // Animation state
    let animationFrame = null;
    let startTime = null;
    let imageLoaded = false;
    let currentProgress = 0;

    // Image URL
    let uploadedUrl = null;

    // Update slider labels
    function updateLabels() {
        initialZoom = Number(zoomInput.value);
        duration = Number(durationInput.value);
        focusY = Number(focusInput.value);

        document.getElementById("zoom-value").textContent =
            initialZoom.toFixed(1) + "×";

        document.getElementById("duration-value").textContent =
            duration.toFixed(1) + " sec";

        document.getElementById("focus-value").textContent =
            focusY.toFixed(2);
    }

    // Render animation frame
    function render(progress) {
        if (!imageLoaded) return;

        progress = Math.max(0, Math.min(1, progress));

        currentProgress = progress;

        // Brushcue zoom formula
        const scale = Math.pow(
            initialZoom,
            1 - progress
        );

        // Image bounds
        const width = preview.clientWidth;
        const height = preview.clientHeight;

        // Translation
        const translateX =
            (width * (1 - scale)) / 2;

        const translateY =
            height * focusY * (1 - scale);

        // Apply transform
        image.style.transform =
            `translate(${translateX}px, ${translateY}px) scale(${scale})`;

        // Progress UI
        progressBar.style.width =
            (progress * 100) + "%";

        progressText.textContent =
            Math.round(progress * 100) + "%";
    }

    // Stop animation
    function stopAnimation() {
        if (animationFrame !== null) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
        }
    }

    // Reset
    function resetAnimation() {
        stopAnimation();

        startTime = null;

        playButton.textContent = "▶ Play Animation";

        render(0);
    }

    // Animation loop
    function animate(timestamp) {
        if (startTime === null) {
            startTime = timestamp;
        }

        const elapsed =
            (timestamp - startTime) / 1000;

        const progress =
            Math.min(1, elapsed / duration);

        render(progress);

        if (progress < 1) {
            animationFrame =
                requestAnimationFrame(animate);
        } else {
            animationFrame = null;

            playButton.textContent =
                "↻ Replay Animation";
        }
    }

    // Play
    playButton.addEventListener("click", () => {
        if (!imageLoaded) {
            fileInput.click();
            return;
        }

        stopAnimation();

        startTime = null;

        playButton.textContent = "Playing…";

        render(0);

        animationFrame =
            requestAnimationFrame(animate);
    });

    // Reset
    resetButton.addEventListener("click", () => {
        resetAnimation();
    });

    // Upload image
    fileInput.addEventListener("change", (event) => {
        const file = event.target.files[0];

        if (!file) return;

        // Clean up old image URL
        if (uploadedUrl) {
            URL.revokeObjectURL(uploadedUrl);
        }

        uploadedUrl =
            URL.createObjectURL(file);

        image.onload = () => {
            imageLoaded = true;

            image.style.display = "block";

            placeholder.style.display = "none";

            // Match preview aspect ratio to image
            preview.style.aspectRatio =
                `${image.naturalWidth}/${image.naturalHeight}`;

            document.getElementById("file-name").textContent =
                file.name;

            resetAnimation();
        };

        image.src = uploadedUrl;
    });

    // Slider updates
    [zoomInput, durationInput, focusInput].forEach(input => {
        input.addEventListener("input", () => {
            updateLabels();

            // Update preview if not currently playing
            if (animationFrame === null) {
                render(currentProgress);
            }
        });
    });

    // Window resizing
    window.addEventListener("resize", () => {
        if (imageLoaded && animationFrame === null) {
            render(currentProgress);
        }
    });

    // Initialize
    updateLabels();
</script>

</body>
</html>
