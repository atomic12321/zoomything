<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brushcue Zoom Animator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #111318;
            color: #e5e7eb;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            padding-bottom: 150px;
        }

        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 22px;
            font-weight: 750;
        }

        .subtitle {
            font-size: 13px;
            color: #9ca3af;
        }

        .upload {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="file"] {
            display: none;
        }

        .upload-label {
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            background: #292c35;
            color: #e5e7eb;
            transition: background 0.2s;
        }

        .upload-label:hover {
            background: #383b46;
        }

        .file-name {
            font-size: 12px;
            color: #9ca3af;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Preview */

        .preview-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview {
            position: relative;
            background: #050505;
            overflow: hidden;
            border-radius: 10px;
            width: min(600px, 90vw);
            max-height: 55vh;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            display: none;
        }

        #placeholder {
            color: #737783;
            text-align: center;
            padding: 20px;
        }

        #placeholder .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        /* Playback */

        .playback {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            transition: background 0.2s, transform 0.15s;
        }

        button:hover {
            filter: brightness(1.15);
        }

        button:active {
            transform: scale(0.97);
        }

        .primary {
            background: #8b5cf6;
            color: white;
        }

        .secondary {
            background: #292c35;
            color: #e5e7eb;
        }

        /* Progress */

        .progress-container {
            width: min(600px, 90vw);
            height: 4px;
            background: #30333d;
            border-radius: 6px;
            margin-top: 20px;
            overflow: hidden;
        }

        #progress {
            width: 0%;
            height: 100%;
            background: #8b5cf6;
        }

        #progress-text {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 6px;
        }

        /* Bottom toolbar */

        .toolbar-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: min(500px, calc(100vw - 30px));
            z-index: 100;
        }

        .settings-panel {
            background: #1b1d24;
            border: 1px solid #383b46;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 10px;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            animation: panelOpen 0.18s ease;
        }

        .settings-panel.open {
            display: block;
        }

        @keyframes panelOpen {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .panel-title {
            font-weight: 650;
            font-size: 14px;
        }

        .panel-value {
            color: #c4b5fd;
            font-variant-numeric: tabular-nums;
        }

        .panel-close {
            background: transparent;
            color: #9ca3af;
            font-size: 20px;
            padding: 2px 8px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #8b5cf6;
            cursor: pointer;
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 6px;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 8px;
            background: #1b1d24;
            border: 1px solid #383b46;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .tool-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: transparent;
            color: #9ca3af;
            border-radius: 10px;
            width: 75px;
            height: 60px;
            padding: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .tool-button:hover {
            background: #292c35;
            color: white;
        }

        .tool-button.active {
            background: #8b5cf6;
            color: white;
        }

        .tool-icon {
            font-size: 20px;
            line-height: 1;
        }

        .tool-label {
            font-size: 11px;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .app {
                padding: 15px;
                padding-bottom: 150px;
            }

            .header {
                align-items: flex-start;
            }

            .toolbar {
                gap: 2px;
            }

            .tool-button {
                width: 65px;
            }

            .preview {
                width: 95vw;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Header -->
    <div class="header">
        <div>
            <div class="title">Zoom Animator</div>
            <div class="subtitle">Brushcue-style image zoom</div>
        </div>

        <div class="upload">
            <label for="file" class="upload-label">
                Upload Image
            </label>

            <input id="file" type="file" accept="image/*">

            <span id="file-name" class="file-name">
                No image selected
            </span>
        </div>
    </div>

    <!-- Preview -->
    <div class="preview-wrapper">
        <div class="preview" id="preview">

            <img id="image" alt="Preview">

            <div id="placeholder">
                <div class="icon">＋</div>
                <div>Upload an image to preview your animation</div>
            </div>

        </div>
    </div>

    <!-- Playback buttons -->
    <div class="playback">
        <button id="play" class="primary">
            ▶ Play
        </button>

        <button id="reset" class="secondary">
            ↺ Reset
        </button>

        <button id="save" class="primary">
            ↓ Save Video
        </button>
    </div>

    <!-- Progress -->
    <div class="progress-container">
        <div id="progress"></div>
    </div>

    <div id="progress-text">
        0%
    </div>

</div>

<!-- Bottom toolbar -->
<div class="toolbar-container">

    <!-- Zoom Panel -->
    <div class="settings-panel" id="panel-zoom">
        <div class="panel-header">
            <span class="panel-title">Initial Zoom</span>
            <span class="panel-value" id="zoom-value">6.3×</span>
        </div>

        <input
            id="zoom"
            type="range"
            min="1"
            max="100"
            step="0.1"
            value="6.3"
        >
    </div>

    <!-- Duration Panel -->
    <div class="settings-panel" id="panel-duration">
        <div class="panel-header">
            <span class="panel-title">Duration</span>
            <span class="panel-value" id="duration-value">7.7 sec</span>
        </div>

        <input
            id="duration"
            type="range"
            min="0.5"
            max="45"
            step="0.1"
            value="7.7"
        >
    </div>

    <!-- Horizontal Focus Panel -->
    <div class="settings-panel" id="panel-horizontal">
        <div class="panel-header">
            <span class="panel-title">Horizontal Focus</span>
            <span class="panel-value" id="horizontal-value">0.50</span>
        </div>

        <input
            id="horizontal"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
        >

        <div class="range-labels">
            <span>Left</span>
            <span>Center</span>
            <span>Right</span>
        </div>
    </div>

    <!-- Vertical Focus Panel -->
    <div class="settings-panel" id="panel-vertical">
        <div class="panel-header">
            <span class="panel-title">Vertical Focus</span>
            <span class="panel-value" id="vertical-value">0.35</span>
        </div>

        <input
            id="vertical"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.35"
        >

        <div class="range-labels">
            <span>Top</span>
            <span>Center</span>
            <span>Bottom</span>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">

        <button class="tool-button" data-panel="zoom">
            <span class="tool-icon">⌕</span>
            <span class="tool-label">Zoom</span>
        </button>

        <button class="tool-button" data-panel="duration">
            <span class="tool-icon">◷</span>
            <span class="tool-label">Duration</span>
        </button>

        <button class="tool-button" data-panel="horizontal">
            <span class="tool-icon">↔</span>
            <span class="tool-label">Horizontal</span>
        </button>

        <button class="tool-button" data-panel="vertical">
            <span class="tool-icon">↕</span>
            <span class="tool-label">Vertical</span>
        </button>

    </div>

</div>
