
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview {
            position: relative;
            width: min(600px, 90vw);
            aspect-ratio: 16 / 9;
            max-height: 55vh;
            background: black;
            overflow: hidden;
            border-radius: 12px;
        }

        #image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            display: none;
        }

        #upload {
            margin-bottom: 20px;
        }

        .toolbar {
            position: fixed;
            bottom: 25px;
            display: flex;
            gap: 10px;
            background: #222;
            padding: 10px;
            border-radius: 14px;
        }

        .tool {
            position: relative;
        }

        .tool-button {
            width: 45px;
            height: 45px;
            background: #333;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.2s;
        }

        .tool-button:hover {
            background: #444;
        }

        .panel {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            background: #222;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            display: none;
        }

        .panel.open {
            display: block;
        }

        .panel label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .panel input {
            width: 100%;
        }

        .value {
            text-align: center;
            margin-top: 5px;
            font-size: 13px;
            color: #aaa;
        }

        button {
            font-family: inherit;
        }
    </style>
</head>

<body>

    <input type="file" id="upload" accept="image/*">

    <div class="preview">
        <img id="image">
    </div>

    <div class="toolbar">

        <div class="tool">
            <button class="tool-button" onclick="togglePanel('zoom')" title="Zoom">⌕</button>
            <div class="panel" id="zoom">
                <label>
                    Initial Zoom
                    <input type="range" id="initialZoom" min="1" max="100" step="0.1" value="6.3">
                    <div class="value" id="zoomValue">6.3</div>
                </label>
            </div>
        </div>

        <div class="tool">
            <button class="tool-button" onclick="togglePanel('duration')" title="Duration">◷</button>
            <div class="panel" id="duration">
                <label>
                    Duration
                    <input type="range" id="durationInput" min="0.5" max="45" step="0.1" value="7.7">
                    <div class="value" id="durationValue">7.7s</div>
                </label>
            </div>
        </div>

        <div class="tool">
            <button class="tool-button" onclick="togglePanel('horizontal')" title="Horizontal Focus">↔</button>
            <div class="panel" id="horizontal">
                <label>
                    Focus X
                    <input type="range" id="focusX" min="0" max="1" step="0.01" value="0.5">
                    <div class="value" id="focusXValue">0.50</div>
                </label>
            </div>
        </div>

        <div class="tool">
            <button class="tool-button" onclick="togglePanel('vertical')" title="Vertical Focus">↕</button>
            <div class="panel" id="vertical">
                <label>
                    Focus Y
                    <input type="range" id="focusY" min="0" max="1" step="0.01" value="0.35">
                    <div class="value" id="focusYValue">0.35</div>
                </label>
            </div>
        </div>

    </div>

    <script>
        const image = document.getElementById("image");
        const upload = document.getElementById("upload");

        const initialZoomInput = document.getElementById("initialZoom");
        const durationInput = document.getElementById("durationInput");
        const focusXInput = document.getElementById("focusX");
        const focusYInput = document.getElementById("focusY");

        const zoomValue = document.getElementById("zoomValue");
        const durationValue = document.getElementById("durationValue");
        const focusXValue = document.getElementById("focusXValue");
        const focusYValue = document.getElementById("focusYValue");

        let animationStart = null;
        let animationFrame = null;

        function togglePanel(id) {
            const panels = document.querySelectorAll(".panel");

            panels.forEach(panel => {
                if (panel.id === id) {
                    panel.classList.toggle("open");
                } else {
                    panel.classList.remove("open");
                }
            });
        }

        upload.addEventListener("change", function(event) {
            const file = event.target.files[0];

            if (!file) return;

            const url = URL.createObjectURL(file);

            image.src = url;
            image.style.display = "block";

            image.onload = () => {
                startAnimation();
            };
        });

        function startAnimation() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
            }

            animationStart = null;

            animationFrame = requestAnimationFrame(animate);
        }

        function animate(timestamp) {
            if (!animationStart) {
                animationStart = timestamp;
            }

            const initialZoom = parseFloat(initialZoomInput.value);
            const duration = parseFloat(durationInput.value);
            const focusX = parseFloat(focusXInput.value);
            const focusY = parseFloat(focusYInput.value);

            const elapsed = (timestamp - animationStart) / 1000;
            const progress = Math.min(1, elapsed / duration);

            const scale = Math.pow(initialZoom, 1 - progress);

            const bounds = image.parentElement.getBoundingClientRect();

            const translateX = bounds.width * focusX * (1 - scale);
            const translateY = bounds.height * focusY * (1 - scale);

            image.style.transform = `
                translate(${translateX}px, ${translateY}px)
                scale(${scale})
            `;

            if (progress < 1) {
                animationFrame = requestAnimationFrame(animate);
            }
        }

        initialZoomInput.addEventListener("input", () => {
            zoomValue.textContent = initialZoomInput.value;
            startAnimation();
        });

        durationInput.addEventListener("input", () => {
            durationValue.textContent = durationInput.value + "s";
            startAnimation();
        });

        focusXInput.addEventListener("input", () => {
            focusXValue.textContent = parseFloat(focusXInput.value).toFixed(2);
            startAnimation();
        });

        focusYInput.addEventListener("input", () => {
            focusYValue.textContent = parseFloat(focusYInput.value).toFixed(2);
            startAnimation();
        });

    </script>

</body>
</html>
